<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book My Event</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    header { background: #1e90ff; color: white; padding: 1em; display: flex; justify-content: space-between; align-items: center; }
    nav a { margin: 0 15px; color: white; text-decoration: none; }
    .container { padding: 2em; }
    .search-bar { display: flex; gap: 10px; margin-bottom: 2em; }
    input[type="text"] { padding: 10px; width: 200px; }
    button { padding: 10px 15px; background-color: #1e90ff; color: white; border: none; cursor: pointer; }
    .event-list { display: flex; gap: 2em; }
    .event-card { border: 1px solid #ccc; padding: 1em; width: 30%; text-align: center; }
    .event-card img { width: 100%; height: 150px; background-color: #f0f0f0; }
    .event-card h3, .event-card p { margin: 10px 0; }
  </style>
</head>
<body>
  <header>
    <div><strong>BookMyEvent</strong></div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Events</a>
      <a href="#">My Tickets</a>
      <a href="#">Log In</a>
    </nav>
  </header>
  <div class="container">
    <h2>Book Your Next Event</h2>
    <div class="search-bar">
      <input type="text" placeholder="Search for event">
      <input type="text" placeholder="City or Location">
      <button>Search</button>
    </div>

    <h3>Popular Events</h3>
    <div class="event-list">
      <div class="event-card">
        <img src="entertainment.jpg" alt="Entertainment Event">
        <h3>Event Name</h3>
        <button>View Tickets</button>
      </div>
      <div class="event-card">
        <img src="sports.jpg" alt="Sports Event">
        <h3>Event Name</h3>
        <button>View Tickets</button>
      </div>
      <div class="event-card">
        <img src="music.jpg" alt="Music Event">
        <h3>Event Name</h3>
        <button>View Tickets</button>
      </div>
    </div>
  </div>
</body>
</html>
